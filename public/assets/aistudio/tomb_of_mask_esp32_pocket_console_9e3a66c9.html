<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomb of Mask Pocket Console</title>
<style>
  :root { --bg:#0b0b1a; --panel:#1a1a33; --panel-hi:#34346b; --ink:#f0e6ff; --accent:#ff4fb8; --ok:#5fe3a1; --bad:#ff6b5e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #app { position:fixed; inset:0; height:100vh; height:100dvh; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; flex:none; }
  #status { flex:1; min-width:0; font-size:clamp(12px,1.6vmin + 8px,15px); opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); margin-right:8px; }
  #status.on::before { background:var(--ok); }
  .pill { background:var(--panel); color:var(--ink); border:2px solid var(--panel-hi); border-radius:999px;
    padding:8px 14px; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer; font-family:inherit; }
  .pill:hover { border-color:#8a8ae0; }
  .pill.accent { background:var(--accent); border-color:var(--accent); color:#200014; font-weight:700; }
  #stage { flex:1; min-height:0; min-width:0; display:flex; align-items:center; justify-content:center; padding:4px 8px 8px; overflow:hidden; }
  #screen { background:#000; border:2px solid var(--panel-hi); border-radius:10px; overflow:hidden; flex:none; }
  #screen canvas { display:block; width:100%; height:100%; }
  #hint { text-align:center; font-size:12px; opacity:.65; padding:0 16px 8px; flex:none; }
  #hint:empty { display:none; }
  /* short landscape screens (phones on their side): controls move to a slim column on the left */
  @media (orientation:landscape) and (max-height:520px) {
    #app { flex-direction:row; }
    header { flex-direction:column; align-items:stretch; width:auto; max-width:150px; padding:8px; justify-content:flex-start; }
    #status { flex:none; white-space:normal; font-size:12px; margin-bottom:4px; }
    .pill { padding:7px 10px; font-size:13px; }
    #stage { padding:6px 8px 6px 0; }
    #hint { display:none; }
  }
  /* full screen: only the game is left */
  #app.fs header, #app.fs #hint { display:none; }
  #app.fs #stage { padding:0; }
  #app.fs #screen { border-width:0; border-radius:0; }
  @media (max-width:380px) { .pill { padding:7px 10px; font-size:13px; } header { gap:6px; padding:6px 8px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="status">Not connected</div>
    <button class="pill" id="sndBtn" title="Game sound on this device (music + effects)">🔊</button>
    <button class="pill" id="fsBtn" title="Full screen" hidden>⛶</button>
    <button class="pill accent" id="connect">Connect</button>
  </header>
  <div id="stage"><div id="screen"><canvas id="gv"></canvas></div></div>
  <div id="hint"></div>
</div>

<script>
const NUS_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const $ = id => document.getElementById(id);
const stage = $("stage");
const statusEl = $("status"), hintEl = $("hint"), connectBtn = $("connect");

/* ---------------------------------------------------------------- Bluetooth (receive only: this page just shows the game) */
let device = null;
function setStatus(text, on) { statusEl.textContent = text; statusEl.classList.toggle("on", !!on); }

let wantConn = false, retryN = 0, retryTimer = null;
async function attach(server) {
  const svc = await server.getPrimaryService(NUS_SERVICE);
  const tx = await svc.getCharacteristic(NUS_TX);
  await tx.startNotifications();
  tx.addEventListener("characteristicvaluechanged", e => onPkt(e.target.value));
  retryN = 0;
  setStatus("Connected: " + (device.name || "MaskMaze"), true);
  connectBtn.textContent = "Disconnect";
  hintEl.textContent = "Play with the joystick and buttons on the device.";
}
async function connect() {
  Snd.init();                             // browsers only allow audio after a tap: the Connect tap unlocks it
  if (!navigator.bluetooth) {
    hintEl.textContent = "Web Bluetooth is not available here. Use Chrome or Edge on Android, Windows, macOS or Linux; on iPhone use the Bluefy browser.";
    return;
  }
  try {
    setStatus("Searching...", false);
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS_SERVICE] }],
      optionalServices: [NUS_SERVICE]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    wantConn = true; retryN = 0;
    setStatus("Connecting...", false);
    await attach(await device.gatt.connect());
  } catch (e) {
    wantConn = false;
    setStatus("Not connected", false);
    if (!(e && e.name === "NotFoundError")) hintEl.textContent = "Could not connect: " + (e && e.message ? e.message : e);
  }
}
function giveUp() { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); wantConn = false; setStatus("Disconnected", false); connectBtn.textContent = "Connect"; }
function onDisconnected() {                // a dropped link is retried by itself, the game view just waits
  G.p = null; Snd.want = -1;
  if (wantConn && retryN < 8) { setStatus("Reconnecting...", false); connectBtn.textContent = "Stop"; clearTimeout(retryTimer); retryTimer = setTimeout(reconnect, Math.min(4000, 700 * (retryN + 1))); }
  else giveUp();
}
async function reconnect() {
  if (!wantConn || !device) return;
  try { await attach(await device.gatt.connect()); }
  catch (e) { retryN++; if (retryN < 8) { setStatus("Reconnecting...", false); retryTimer = setTimeout(reconnect, Math.min(4000, 700 * (retryN + 1))); } else giveUp(); }
}
connectBtn.addEventListener("click", () => {
  if (wantConn) { wantConn = false; clearTimeout(retryTimer); if (device && device.gatt.connected) device.gatt.disconnect(); else giveUp(); }
  else connect();
});

/* ------------------------------------------------------------------ responsive layout */
// the game fills the whole stage: portrait or landscape, whatever shape the window has
const scr = $("screen");
function layout() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  const cs = getComputedStyle(stage);
  const aw = w - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = h - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  scr.style.width = Math.max(60, Math.floor(aw)) + "px"; scr.style.height = Math.max(60, Math.floor(ah)) + "px";
}
new ResizeObserver(layout).observe(stage);
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);

// full screen where the browser allows it (not on iPhone)
const fsBtn = $("fsBtn"), root = document.documentElement;
if (root.requestFullscreen) {
  fsBtn.hidden = false;
  fsBtn.addEventListener("click", () => { if (document.fullscreenElement) document.exitFullscreen(); else root.requestFullscreen().catch(() => {}); });
}
function fsChanged() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $("app").classList.toggle("fs", on);
  setTimeout(layout, 50);
}
document.addEventListener("fullscreenchange", fsChanged);
document.addEventListener("webkitfullscreenchange", fsChanged);
document.addEventListener("contextmenu", e => e.preventDefault());
function onDirEdge() {}                    // no on-screen stick any more; v2 firmware sends the real menu cursors

  const tcx = L.w <= vw ? (L.w - 1) / 2 : cl(G.vx, vw / 2 - .5, L.w - .5 - vw / 2);
  const tcy = L.h <= vh ? (L.h - 1) / 2 : cl(G.vy + vh * .1, vh / 2 - .5, L.h - .5 - vh / 2);
  G.cx += (tcx - G.cx) * kc; G.cy += (tcy - G.cy) * kc;
  const SX = x => cw / 2 + (x - G.cx) * ts - ts / 2, SY = y => ch / 2 - (y - G.cy) * ts - ts / 2;
  const wall = (x, y) => x < 0 || x >= L.w || y < 0 || y >= L.h || L.T[y][x] === 1;
  const clock = (G.clk + (now - G.clkAt)) % 1700;

  gx.fillStyle = "#000"; gx.fillRect(0, 0, cw, ch);
  const x0 = Math.max(0, Math.floor(G.cx - vw / 2) - 1), x1 = Math.min(L.w - 1, Math.ceil(G.cx + vw / 2) + 1);
  const y0 = Math.max(0, Math.floor(G.cy - vh / 2) - 1), y1 = Math.min(L.h - 1, Math.ceil(G.cy + vh / 2) + 1);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const sx = SX(x), sy = SY(y);
    if (L.T[y][x]) { wallTile(sx, sy, ts, W, GL, wall, x, y); continue; }
    const it = L.I[y][x];
    if (it === 1) { gx.fillStyle = D; const d = Math.max(2, ts / 5); gx.fillRect(sx + (ts - d) / 2, sy + (ts - d) / 2, d, d); }
    else if (it === 2) { gx.strokeStyle = D; gx.lineWidth = Math.max(2, ts / 8); gx.beginPath(); gx.arc(sx + ts / 2, sy + ts / 2, ts * .3, 0, 7); gx.stroke(); gx.fillStyle = D; gx.fillRect(sx + ts / 2 - 1, sy + ts * .32, 2, ts * .36); }
    else if (it === 4) star(sx, sy, ts / 8, (Math.floor(now / 450) % 5 === 0) ? "#ffee00" : W);
    else if (it === 5) { const u = ts / 8, glow = Math.floor(now / 350) & 1; gx.fillStyle = W; gx.fillRect(sx + u, sy + u, 6 * u, 6 * u); gx.fillStyle = "#000"; gx.fillRect(sx + 2 * u, sy + 2 * u, 4 * u, 4 * u); gx.fillStyle = glow ? "#fff" : W; gx.fillRect(sx + 3 * u, sy + 3 * u, 2 * u, 2 * u); }
    else if (it === 3) {                            // spike strip: teeth point away from the wall it hangs on
      const wd = wall(x, y + 1) ? 0 : wall(x + 1, y) ? 1 : wall(x, y - 1) ? 2 : 3;
      const t = (clock + L.S[y][x] * 430) % 1700;
      const ph = t < 600 ? 2 : t >= 1450 ? 1 : 0;
      spikeTile(sx, sy, ts, wd, ph, now);
      const dd = Math.abs(y - G.vy) + Math.abs(x - G.vx);
      if (dd < 7) { const key = L.S[y][x], pp = G.spk.get(key); if (pp !== undefined && pp !== ph && ph === 2) sfx("SPIKE", 0, 1 - dd / 7); G.spk.set(key, ph); }
    }
  }
  {   // start gate: skull altar flanked by two flickering torches (stands on the floor of the start tile, rises above it)
    const sx = SX(L.gate[0]), sy = SY(L.gate[1]), u = ts / 8, cx = sx + ts / 2, by = sy + ts, GA = "#4e2670", GB = "#7d4ea5";
    gx.fillStyle = GA; gx.fillRect(cx - 5 * u, by - 12 * u, 10 * u, 12 * u); gx.fillRect(cx - 4 * u, by - 14 * u, 8 * u, 2 * u);
    gx.fillStyle = GB; gx.fillRect(cx - 5 * u, by - 12 * u, u, 12 * u); gx.fillRect(cx + 4 * u, by - 12 * u, u, 12 * u); gx.fillRect(cx - 3 * u, by - 12 * u, 6 * u, 5 * u);
    gx.fillStyle = GA; gx.fillRect(cx - 2 * u, by - 10 * u, u, u); gx.fillRect(cx + u, by - 10 * u, u, u); gx.fillRect(cx - u, by - 8 * u, 2 * u, u);
    for (const side of [-1, 1]) {
      const tx2 = cx + side * 9 * u - u;
      gx.fillStyle = GA; gx.fillRect(tx2, by - 7 * u, 2 * u, 7 * u);
      gx.fillStyle = GB; gx.fillRect(tx2 - u, by - 8 * u, 4 * u, u);
      gx.fillStyle = (Math.floor(now / 120) & 1) ? "#d78cff" : GB; gx.fillRect(tx2, by - 11 * u, 2 * u, 3 * u);
    }
  }

  const dead = p.st === 3, dms = now - G.stAt;
  if (p.st !== 6 && !(dead && dms > 400)) {          // the hero (hidden once it has entered the exit / after the death collapse)
    const col = dead && (Math.floor(dms / 100) & 1) ? "#ff3228" : "#fff000";
    const o = { mv: p.mv && p.st === 1, dir: p.dir, face: p.ext ? p.face : (G.moved ? p.dir : 1), hf: p.left ? 3 : 1, mask: p.mask, col, pose: 0,
                frame: Math.floor(now / 190) & 3, dy: 0, dist: 0 };
    trailState(G.T, o, now, G.vx, G.vy, ts);
    if (dead) { o.pose = 2; o.frame = dms < 220 ? 0 : 1; }                                    // stagger, then squash flat
    else if (!o.mv && p.st === 1 && now - G.landAt < 110) o.dy = ts / 8;                    // tiny squash when landing
    heroDraw(SX(G.vx), SY(G.vy), ts, o);
  }
  fxDraw(now, SX, SY, ts);

  // HUD: three stars on top, coin counter on the left
  const sc = U / 120, su = Math.max(2, Math.round(ts / 9));
  for (let i = 0; i < 3; i++) star(cw / 2 + (i - 1) * 10 * su - 4 * su, 4, su, i < p.stars ? "#ffee00" : W);
  coinIcon(7 * sc, 7 * sc, 5 * sc, "#fff000", "#000");
  txt(String(p.coins), 15 * sc, 3 * sc + U / 15 * .85, "#fff000", U / 15);

  if (p.st === 2) portrait(() => pauseMenu(UI.pauseSel));
  if (p.st === 7) portrait(() => drawClear(now, p));
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!cw) return;
  gx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gx.imageSmoothingEnabled = false;
  LS = cw > ch * 1.15;                                         // landscape layouts
  gx.fillStyle = "#080814"; gx.fillRect(0, 0, cw, ch);
  const p = G.p;
  if (!p || now - G.at > 3000) return note("NO SIGNAL", "Connect to see the game");
  const inLvl = (p.f & 1) && G.L && LVL_STATES.includes(p.st);
  if (!inLvl) {
    if (!(p.f & 1) && [1, 2, 3, 4].includes(p.st) && fresh(X.E)) return drawEndless(now, p);
    if ([0, 5, 8, 9, 10, 11].includes(p.st) && fresh(X.N)) return menuFrame(now, p);
    if (p.st === 12 && fresh(X.J)) { portrait(() => drawJet(now)); if (LS) panels("J"); return; }
    if (p.st === 13 && fresh(X.D)) { portrait(() => drawDot(now)); if (LS) panels("D"); return; }
    if (p.st === 14 && fresh(X.T)) { drawBlocks(now); if (LS) panels("T"); return; }
    return note(STN[p.st] || "...", "playing on the device");
  }
  drawLevel(now, p);
}

requestAnimationFrame(frame);

layout();
if (!navigator.bluetooth) {
  hintEl.textContent = "Web Bluetooth is not available here. Use Chrome or Edge on Android, Windows, macOS or Linux; on iPhone use the Bluefy browser.";
}
</script>
</body>
</html>
